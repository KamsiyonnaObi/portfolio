<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Poppins, Helvetica, Arial, sans-serif" role="img" aria-label="Financial review lifecycle: from opening a member profile to completing a review, with the record visible to the next advisor">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0252CD"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E6A7E"/>
    </marker>
  </defs>
  <rect width="1000" height="400" rx="16" fill="#F3F8FF"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#151E2C">Financial review lifecycle (MVP)</text>

  <rect x="40" y="110" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#CCE1FF" stroke-width="2"/>
  <text x="115" y="146" font-size="14" font-weight="600" fill="#151E2C" text-anchor="middle"><tspan x="115" dy="0">Advisor opens a</tspan><tspan x="115" dy="20">member's profile</tspan></text>
  <text x="115" y="188" font-size="11" fill="#5E6A7E" text-anchor="middle">(access already audited)</text>

  <rect x="235" y="110" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#CCE1FF" stroke-width="2"/>
  <text x="310" y="146" font-size="14" font-weight="600" fill="#151E2C" text-anchor="middle"><tspan x="310" dy="0">Sees member goals</tspan><tspan x="310" dy="20">and past reviews</tspan></text>

  <rect x="430" y="110" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#CCE1FF" stroke-width="2"/>
  <text x="505" y="146" font-size="14" font-weight="600" fill="#151E2C" text-anchor="middle"><tspan x="505" dy="0">Starts a financial</tspan><tspan x="505" dy="20">review</tspan></text>

  <rect x="625" y="110" width="150" height="96" rx="12" fill="#FFFFFF" stroke="#CCE1FF" stroke-width="2"/>
  <text x="700" y="146" font-size="14" font-weight="600" fill="#151E2C" text-anchor="middle"><tspan x="700" dy="0">Updates goals and</tspan><tspan x="700" dy="20">net worth statement</tspan></text>

  <rect x="820" y="110" width="150" height="96" rx="12" fill="#EAF2FF" stroke="#0252CD" stroke-width="3"/>
  <text x="895" y="146" font-size="14" font-weight="600" fill="#151E2C" text-anchor="middle"><tspan x="895" dy="0">Completes review</tspan><tspan x="895" dy="20">with a summary</tspan></text>

  <line x1="190" y1="158" x2="233" y2="158" stroke="#0252CD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="158" x2="428" y2="158" stroke="#0252CD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="158" x2="623" y2="158" stroke="#0252CD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="158" x2="818" y2="158" stroke="#0252CD" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 895 208 C 895 300 310 300 310 210" fill="none" stroke="#0252CD" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="602" y="292" font-size="13" font-weight="600" fill="#0252CD" text-anchor="middle">Saved to history: the next advisor picks up from this record</text>

  <rect x="570" y="336" width="400" height="42" rx="10" fill="none" stroke="#5E6A7E" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="770" y="362" font-size="13" fill="#5E6A7E" text-anchor="middle">Executive Power BI view: deferred after the MVP</text>
</svg>
